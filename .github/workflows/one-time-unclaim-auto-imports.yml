name: One-time unclaim auto imports

on:
  push:
    paths:
      - '.github/workflows/one-time-unclaim-auto-imports.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make auto-imported listings unclaimed
        shell: python
        run: |
          from pathlib import Path

          path = Path("main.js")
          text = path.read_text()
          old = "  const insertPayload = {\n    user_id: adminUser.id,\n"
          new = (
              "  const insertPayload = {\n"
              "    // Auto-imported listings stay unclaimed until a real owner verifies and claims them.\n"
              "    user_id: null,\n"
          )

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one auto-import ownership assignment, found {count}.")

          path.write_text(text.replace(old, new, 1))

      - name: Verify backend syntax
        run: node --check main.js

      - name: Commit the backend change and remove this one-time workflow
        run: |
          git config user.name "TeleHub maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add main.js
          git rm .github/workflows/one-time-unclaim-auto-imports.yml
          git commit -m "Keep auto-imported listings unclaimed"
          git push
