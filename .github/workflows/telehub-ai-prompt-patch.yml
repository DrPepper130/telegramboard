name: Patch TeleHub AI prompt controls

on:
  push:
    paths:
      - ".telehub-ai-prompt-trigger"

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch AI prompt behavior
        run: node .github/scripts/patch-ai-prompt.js

      - name: Syntax check
        run: node --check main.js

      - name: Commit backend prompt patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Let admin prompt control AI listing style" || exit 0
          git push
