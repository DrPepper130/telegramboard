name: Add one-cycle 24/7 seed jumps

on:
  push:
    paths:
      - ".telehub-one-cycle-seeds-trigger"

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch 24/7 seed behavior
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("main.js")
          text = path.read_text(encoding="utf-8")

          def sub_once(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")

          sub_once(
              r'(function continuousAutomationSettings\(state\) \{[\s\S]*?\n\s*return \{\n)(\s*)(seed_limit:)',
              r'\1\2// Optional one-cycle branch jump. These are consumed after the cycle\n\2// completes, then future 24/7 cycles return to automatic seed selection.\n\2seed_links: parseTelegramImportLinks(raw.seed_links || ""),\n\2\3',
              "continuous settings seed links",
          )

          sub_once(
              r'(async function createContinuousAutomationRun\(state\) \{[\s\S]*?continuous: true,\n\s*)seed_links: \[\],',
              r'\1seed_links: settings.seed_links,',
              "continuous run metadata seed links",
          )

          sub_once(
              r'(app\.post\("/api/admin/automation/toggle"[\s\S]*?const settings = \{\n\s*\.\.\.currentSettings,\n)(\s*)(seed_limit:)',
              r'\1\2seed_links:\n\2  req.body?.seed_links === undefined\n\2    ? parseTelegramImportLinks(currentSettings.seed_links || "")\n\2    : parseTelegramImportLinks(req.body.seed_links || ""),\n\2\3',
              "toggle seed links",
          )

          sub_once(
              r'(const \{ data: latestState \} = await supabaseAdmin\n\s*\.from\("telehub_automation_state"\)\n\s*)\.select\("cycle_count"\)',
              r'\1.select("cycle_count, settings")',
              "latest automation settings select",
          )

          sub_once(
              r'(cycle_count: Number\(latestState\?\.cycle_count \|\| 0\) \+ 1,\n)(\s*)(last_cycle_completed_at:)',
              r'\1\2// Explicit seeds are a branch jump for one cycle only.\n\2settings: {\n\2  ...(latestState?.settings && typeof latestState.settings === "object"\n\2    ? latestState.settings\n\2    : {}),\n\2  seed_links: [],\n\2},\n\2\3',
              "consume one-cycle seeds",
          )

          for old_build in [
              '"telehub-admin-controlled-ai-style-2026-08-08"',
              '"telehub-direct-main-resume-pagination-fix-2026-08-08"',
          ]:
              if old_build in text:
                  text = text.replace(old_build, '"telehub-one-cycle-seed-jumps-2026-08-10"', 1)
                  break

          path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: node --check main.js

      - name: Commit backend seed jump patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Use pasted seeds for one 24/7 cycle" || exit 0
          git push
