name: Add one-cycle 24/7 seed jumps

on:
  push:
    paths:
      - ".telehub-one-cycle-seeds-trigger"

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch 24/7 seed behavior
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("main.js")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
          '''  return {
              seed_limit: Math.max(1, Math.min(Number(raw.seed_limit || 1000), 10000)),
          ''',
          '''  return {
              // Optional one-cycle branch jump. These are consumed after the cycle
              // completes, then future 24/7 cycles return to automatic seed selection.
              seed_links: parseTelegramImportLinks(raw.seed_links || ""),
              seed_limit: Math.max(1, Math.min(Number(raw.seed_limit || 1000), 10000)),
          ''',
          "continuous settings seed links")

          replace_once(
          '''    continuous: true,
              seed_links: [],
              seed_limit: settings.seed_limit,
          ''',
          '''    continuous: true,
              seed_links: settings.seed_links,
              seed_limit: settings.seed_limit,
          ''',
          "continuous run metadata seed links")

          replace_once(
          '''    const settings = {
              ...currentSettings,
              seed_limit: Math.max(
          ''',
          '''    const settings = {
              ...currentSettings,
              seed_links:
                req.body?.seed_links === undefined
                  ? parseTelegramImportLinks(currentSettings.seed_links || "")
                  : parseTelegramImportLinks(req.body.seed_links || ""),
              seed_limit: Math.max(
          ''',
          "toggle seed links")

          replace_once(
          '''  const { data: latestState } = await supabaseAdmin
              .from("telehub_automation_state")
              .select("cycle_count")
              .eq("id", CONTINUOUS_AUTOMATION_ROW_ID)
              .single()

            await supabaseAdmin
              .from("telehub_automation_state")
              .update({
                current_run_id: null,
                cycle_count: Number(latestState?.cycle_count || 0) + 1,
          ''',
          '''  const { data: latestState } = await supabaseAdmin
              .from("telehub_automation_state")
              .select("cycle_count, settings")
              .eq("id", CONTINUOUS_AUTOMATION_ROW_ID)
              .single()

            await supabaseAdmin
              .from("telehub_automation_state")
              .update({
                current_run_id: null,
                cycle_count: Number(latestState?.cycle_count || 0) + 1,
                // Explicit seeds are a branch jump for one cycle only. Clearing them
                // here makes the following cycle resume normal automatic seed selection.
                settings: {
                  ...(latestState?.settings && typeof latestState.settings === "object"
                    ? latestState.settings
                    : {}),
                  seed_links: [],
                },
          ''',
          "consume one-cycle seeds")

          old_build = '"telehub-admin-controlled-ai-style-2026-08-08"'
          if old_build in text:
              text = text.replace(old_build, '"telehub-one-cycle-seed-jumps-2026-08-10"', 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: node --check main.js

      - name: Commit backend seed jump patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Use pasted seeds for one 24/7 cycle" || exit 0
          git push
