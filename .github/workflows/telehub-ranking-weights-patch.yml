name: Patch TeleHub ranking weights

on:
  push:
    paths:
      - ".telehub-ranking-trigger"

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch ranking mix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("main.js")
          text = path.read_text(encoding="utf-8")

          old = '''  const freshnessScore = getFreshnessScore(listing)

  // Member count contributes up to 5 points. Log scaling keeps a huge
  // channel from overwhelming the rest of the ranking signals.
  // 1,000,000 members reaches the full member-count component.
  const memberCountScore = normalizeLogScore(
    listing.member_count || 0,
    1_000_000
  )
'''
          new = '''  const rawFreshnessScore = getFreshnessScore(listing)

  // Untouched listings should not get pushed to the front just because they
  // were imported recently. If a listing has no votes, referrals, or measured
  // growth, give it only 20% of the already-small freshness component.
  const hasRankingActivity =
    Number(listing.votes_count || 0) > 0 ||
    Number(listing.referral_boost_score || 0) > 0 ||
    Number(listing.member_growth_24h || 0) > 0

  const freshnessScore = hasRankingActivity
    ? rawFreshnessScore
    : rawFreshnessScore * 0.2

  // Member count remains a 5% signal and uses log scaling so established,
  // untouched listings can naturally mix with newly imported untouched ones.
  const memberCountScore = normalizeLogScore(
    listing.member_count || 0,
    1_000_000
  )
'''

          count = text.count(old)
          if count < 1:
              raise SystemExit(f"current ranking score block not found; found {count}")
          text = text.replace(old, new)

          helper_anchor = 'function getFreshnessScore(listing) {\n'
          helper = '''function stableRankingTieBreak(listing) {
  const value = String(
    listing?.id ||
    listing?.telegram_link ||
    listing?.telegram_username ||
    listing?.channel_name ||
    ""
  )

  let hash = 2166136261
  for (let index = 0; index < value.length; index += 1) {
    hash ^= value.charCodeAt(index)
    hash = Math.imul(hash, 16777619)
  }

  return hash >>> 0
}

'''
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit("freshness helper anchor not found")
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_sort = '''      .sort((a, b) => {
        if (b.ranking_score !== a.ranking_score) {
          return b.ranking_score - a.ranking_score
        }

        return (
          new Date(b.created_at).getTime() -
          new Date(a.created_at).getTime()
        )
      })'''
          new_sort = '''      .sort((a, b) => {
        if (b.ranking_score !== a.ranking_score) {
          return b.ranking_score - a.ranking_score
        }

        // Do not use newest-first as the tie-breaker. Prefer member count,
        // then a stable age-neutral hash so old/new untouched rows are mixed.
        const memberDiff = Number(b.member_count || 0) - Number(a.member_count || 0)
        if (memberDiff !== 0) return memberDiff

        return stableRankingTieBreak(a) - stableRankingTieBreak(b)
      })'''

          sort_count = text.count(old_sort)
          if sort_count < 1:
              raise SystemExit(f"newest-first tie-break not found; found {sort_count}")
          text = text.replace(old_sort, new_sort)

          text = text.replace(
              '"telehub-admin-controlled-ai-style-2026-08-08"',
              '"telehub-coldstart-ranking-mix-2026-08-09"',
              1,
          )

          path.write_text(text, encoding="utf-8")
          print(f"Patched {count} ranking score block(s) and {sort_count} sort block(s).")
          PY

      - name: Syntax check
        run: node --check main.js

      - name: Commit ranking patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Mix untouched listings by quality instead of age" || exit 0
          git push
