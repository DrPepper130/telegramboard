name: Patch TeleHub ranking weights

on:
  push:
    paths:
      - ".telehub-ranking-trigger"

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch ranking mix
        run: node patch-ranking-mix.js

      - name: Syntax check
        run: node --check main.js

      - name: Commit ranking patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Mix untouched listings by quality instead of age" || exit 0
          git push
